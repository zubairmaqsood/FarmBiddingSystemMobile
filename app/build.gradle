plugins {
    id 'com.android.application' // 🔄 Cleaned up standard application plugin id
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    // 🔄 FIXED: Matches your actual project package path from your computer directory
    namespace 'com.example.farmbiddingsystemmobile'

    // 🔄 FIXED: Swapped out the broken syntax with the standard clean SDK assignment
    compileSdk 36

    defaultConfig {
        // 🔄 FIXED: Aligned with your actual package structure
        applicationId "com.example.farmbiddingsystemmobile"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "com.github.bumptech.glide:glide:4.16.0" // Standard stable declaration style

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // OkHttp for your AI Manager connections
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}