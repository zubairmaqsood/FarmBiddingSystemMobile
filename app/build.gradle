plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.farmbiddingsystem'
    compileSdk 36 // <-- FIXED: Updated to 36 to match your dependencies

    defaultConfig {
        applicationId "com.example.farmbiddingsystem"
        minSdk 24
        targetSdk 36 // <-- FIXED: Updated to 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Safely load the local.properties file
        def localProps = new Properties()
        def localPropertiesFile = project.rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProps.load(localPropertiesFile.newDataInputStream())
        }

        def geminiApiKey = localProps.getProperty('GEMINI_API_KEY') ?: '""'
        buildConfigField "String", "GEMINI_API_KEY", geminiApiKey
    }

    // MUST ENABLE THIS so Android generates the BuildConfig file for your key
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.glide
    implementation libs.recyclerview
    // Retrofit core library
    implementation libs.retrofit
    // Converter library to automatically parse JSON into Java Objects
    implementation(libs.converter.gson)
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}